<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio Desktop Lyrics</title>
  <style>
    :root{
      --lyric-primary:#f6fdff;
      --lyric-secondary:#a8f6ff;
      --lyric-highlight:#fff0b8;
      --lyric-glow:#9cffdf;
      --lyric-font:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      --lyric-weight:900;
      --lyric-letter-spacing:0px;
      --lyric-line-height:1;
      --lyric-size:58px;
      --lyric-progress:0%;
      --lyric-feather:5.5%;
      --lyric-fit-x:1;
      --lyric-scroll-x:0px;
      --lyric-align:center;
      --lyric-edge-width:92px;
      --lyric-mask-edge-width:92px;
      --lyric-vertical-feather:46px;
      --lyric-css-beat-glow:0px;
      --lyric-shadow-soft:rgba(156,255,223,.44);
      --lyric-shadow-glow:rgba(156,255,223,.34);
      --lyric-shadow-hot:rgba(255,240,184,.32);
      --lyric-edge:rgba(4,6,12,.42);
      --lyric-drop:rgba(156,255,223,.38);
      --lyric-drop-paused:rgba(156,255,223,.22);
    }
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
    body{opacity:0;transition:opacity .22s ease;-webkit-app-region:no-drag}
    body.show{opacity:1}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
    .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px;pointer-events:none}
    .stage{
      position:relative;
      z-index:3;
      max-width:calc(100vw - 24px);
      padding:104px 86px 94px;
      box-sizing:border-box;
      pointer-events:auto;
      cursor:default;
      transform-style:preserve-3d;
      transform-origin:center;
      will-change:transform,filter;
      contain:layout style;
      backface-visibility:hidden;
      -webkit-app-region:no-drag;
    }
    body.unlocked .stage{cursor:move}
    body.unlocked .stage.hint-visible{cursor:move;-webkit-app-region:no-drag}
    .lyric-viewport{
      position:relative;
      z-index:2;
      display:block;
      width:min(100%,1120px);
      max-width:calc(100vw - 24px);
      margin:0 auto;
      padding:1.24em var(--lyric-edge-width) 1.34em;
      box-sizing:border-box;
      overflow:hidden;
      text-align:var(--lyric-align);
      pointer-events:none;
      isolation:isolate;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--lyric-mask-edge-width),#000 calc(100% - var(--lyric-mask-edge-width)),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 var(--lyric-mask-edge-width),#000 calc(100% - var(--lyric-mask-edge-width)),transparent 100%);
      filter:drop-shadow(0 1px 2.4px rgba(4,6,12,.58)) drop-shadow(0 0 4.8px rgba(4,6,12,.30));
      transform:translateZ(0);
      will-change:transform,filter;
    }
    body.unlocked .stage.hint-visible .lyric-viewport{pointer-events:auto;cursor:move;-webkit-app-region:no-drag}
    .lyric-scroll{
      display:inline-block;
      transform:translate3d(var(--lyric-scroll-x),0,0) scaleX(var(--lyric-fit-x));
      transform-origin:var(--lyric-align);
      will-change:transform;
      backface-visibility:hidden;
    }
    .line{
      position:relative;
      z-index:2;
      display:inline-block;
      max-width:none;
      color:#fff;
      font-family:var(--lyric-font);
      font-size:var(--lyric-size);
      font-weight:var(--lyric-weight);
      line-height:var(--lyric-line-height);
      letter-spacing:var(--lyric-letter-spacing);
      text-align:var(--lyric-align);
      white-space:pre-line;
      overflow:visible;
      text-overflow:clip;
      padding:.20em .12em .34em;
      margin:-.20em -.12em -.34em;
      background:linear-gradient(90deg,var(--lyric-primary),var(--lyric-primary));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:.18px rgba(255,255,255,.72);
      paint-order:stroke fill;
      text-shadow:0 0 1px rgba(255,255,255,.34),0 0 calc(6px + var(--lyric-css-beat-glow)) var(--lyric-shadow-soft),0 0 calc(14px + var(--lyric-css-beat-glow)) var(--lyric-shadow-glow);
      filter:none;
      opacity:0;
      transform:translate3d(0,0,0);
      transform-origin:center;
      backface-visibility:hidden;
      will-change:opacity,filter,transform,background;
    }
    body.highlight .line,body.flowing .line{
      background:linear-gradient(90deg,
        var(--lyric-highlight) 0%,
        var(--lyric-highlight) max(0%,calc(var(--lyric-progress) - var(--lyric-feather))),
        color-mix(in srgb,var(--lyric-highlight) 84%,var(--lyric-glow)) var(--lyric-progress),
        var(--lyric-glow) calc(var(--lyric-progress) + max(2.4%,var(--lyric-feather) * .70)),
        var(--lyric-primary) calc(var(--lyric-progress) + var(--lyric-feather) * 1.35),
        var(--lyric-primary) 100%);
      -webkit-background-clip:text;
      background-clip:text;
    }
    .line.in{animation:lyr-in 820ms cubic-bezier(.16,.84,.32,1.02) forwards}
    body.stable .line.in{animation:lyr-in-stable 420ms cubic-bezier(.2,.8,.2,1) forwards}
    body.paused .line{filter:none;opacity:.84}
    .lock-hint{
      position:absolute;
      z-index:4;
      left:50%;
      top:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-width:92px;
      min-height:30px;
      padding:0 11px;
      border-radius:999px;
      border:1px solid color-mix(in srgb,var(--lyric-glow) 58%,rgba(255,255,255,.36));
      background:rgba(4,6,10,.44);
      color:rgba(255,255,255,.84);
      font:800 12px/1 "Microsoft YaHei",sans-serif;
      text-shadow:0 1px 10px rgba(0,0,0,.55);
      box-shadow:0 0 20px color-mix(in srgb,var(--lyric-glow) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.16);
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%) translateY(-8px) scale(.92);
      transition:opacity .16s ease,transform .16s ease;
      -webkit-app-region:no-drag;
    }
    .lock-icon{
      position:relative;
      width:13px;
      height:13px;
      flex:0 0 auto;
    }
    .lock-icon::before{content:"";position:absolute;left:2px;bottom:1px;width:9px;height:7px;border:1.7px solid var(--lyric-highlight);border-radius:2px;box-sizing:border-box}
    .lock-icon::after{content:"";position:absolute;left:3px;top:0;width:7px;height:8px;border:1.7px solid var(--lyric-highlight);border-bottom:0;border-radius:7px 7px 0 0;box-sizing:border-box}
    body.unlocked .lock-icon::after{left:7px;transform:rotate(24deg);transform-origin:left bottom}
    .lyrics-tool-btn{
      display:none;
      align-items:center;
      justify-content:center;
      height:22px;
      width:auto;
      margin-right:-4px;
      border:0;
      border-left:1px solid rgba(255,255,255,.14);
      padding:0 0 1px 9px;
      background:transparent;
      color:rgba(255,255,255,.82);
      font:800 12px/1 "Microsoft YaHei",sans-serif;
      cursor:pointer;
      text-shadow:0 0 12px var(--lyric-primary);
      -webkit-app-region:no-drag;
    }
    .lyrics-tool-btn:hover{color:#fff}
    .lyrics-tool-btn:disabled{opacity:.34;cursor:default}
    .lyrics-size-step{
      width:23px;
      margin-right:-4px;
      padding:0 0 1px;
      font:900 16px/1 Arial,sans-serif;
    }
    .lyrics-stable-toggle{display:flex;min-width:36px}
    .lyrics-stable-toggle.active{color:var(--lyric-highlight);text-shadow:0 0 14px var(--lyric-glow)}
    .lyrics-tool-label{display:flex;align-items:center;height:22px;margin:0 -2px 0 1px;color:rgba(255,255,255,.58);font:800 10px/1 "Microsoft YaHei",sans-serif;white-space:nowrap}
    .lyrics-glow-step{display:flex;width:20px;margin-right:-4px;padding:0 0 1px;font:900 15px/1 Arial,sans-serif}
    .lyrics-playback-btn{display:none;width:22px;height:22px;margin-right:-4px;padding:0 0 1px;border-left:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.82);font:900 14px/1 Arial,sans-serif}
    .lyrics-playback-btn svg{width:14px;height:14px;pointer-events:none}
    .lyrics-playback-btn.play-toggle{width:26px;height:26px;padding:0;border:1px solid color-mix(in srgb,var(--lyric-glow) 42%,rgba(255,255,255,.22));border-radius:50%;background:rgba(18,30,31,.72);color:var(--lyric-glow)}
    .lyrics-playback-btn.play-toggle svg{width:15px;height:15px}
    .lyrics-playback-btn .pause-icon{display:none}
    .lyrics-playback-btn.is-playing .play-icon{display:none}
    .lyrics-playback-btn.is-playing .pause-icon{display:block}
    .lyrics-close{min-width:22px;margin-left:1px;padding:0;border-left:1px solid rgba(255,255,255,.14);font-size:19px;line-height:1}
    .lyrics-size-value{
      display:none;
      align-items:center;
      justify-content:flex-end;
      width:34px;
      height:22px;
      margin:0 -4px;
      color:rgba(255,255,255,.52);
      font:800 10px/1 "Microsoft YaHei",sans-serif;
      font-variant-numeric:tabular-nums;
      text-align:right;
      white-space:nowrap;
      pointer-events:none;
    }
    .lyrics-glow-value{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      width:34px;
      height:22px;
      margin:0 -4px;
      color:rgba(255,255,255,.64);
      font:800 10px/1 "Microsoft YaHei",sans-serif;
      font-variant-numeric:tabular-nums;
      text-align:right;
      white-space:nowrap;
      pointer-events:none;
    }
    body.unlocked .lyrics-tool-btn{display:flex}
    body.unlocked .lyrics-playback-btn{display:flex}
    body.unlocked .lyrics-size-value{display:flex}
    body.locked .lyrics-lock-toggle{display:flex}
    body.unlocked .stage.hint-visible .lock-hint,body.locked .stage.hint-visible .lock-hint{pointer-events:auto;-webkit-app-region:no-drag}
    .stage.hint-visible .lock-hint{opacity:.94;transform:translateX(-50%) translateY(0) scale(1)}
    .stage.hint-below .lock-hint{transform:translateX(-50%) translateY(8px) scale(.92)}
    .stage.hint-below.hint-visible .lock-hint{transform:translateX(-50%) translateY(0) scale(1)}
    @keyframes lyr-in{
      0%{opacity:0;transform:translate3d(0,32px,-120px) rotateX(24deg) rotateY(-18deg) scale(.78);filter:blur(12px)}
      58%{opacity:1;filter:blur(0)}
      100%{opacity:1;transform:translate3d(0,0,0) rotateX(0deg) rotateY(0deg) scale(1);filter:blur(0)}
    }
    @keyframes lyr-in-stable{
      0%{opacity:0;transform:translate3d(0,0,0) scale(.985);filter:blur(4px)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
    }
  </style>
</head>

"lyrics-tool-btn lyrics-stable-toggle" type="button" aria-label="Toggle fixed desktop lyric position" aria-pressed="false">固定</button><button id="closeLyricsBtn" class="lyrics-tool-btn lyrics-close" type="button" aria-label="关闭桌面歌词" title="关闭桌面歌词">×</button></div>
    </div>

        if (hintVisible && (!lastHintPositionAt || nowMs - lastHintPositionAt >= 32)) {
          lastHintPositionAt = nowMs;
          positionInteractionHint();
        }
        var rectKey = layoutKey + '|' + lastStageTransform + '|' + lastScrollX;
        var rect = (lastLineRect && rectKey === lastLineRectKey) ? lastLineRect : (lastLineRectKey = rectKey, lastLineRect = line.getBoundingClientRect());
        if (canvas.width && canvas.height) {
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          if (rect && rect.width > 1 && rect.height > 1) {
            drawAura(rect, motion);
            drawGlowText(rect, motion);
            drawHighlightBloom(rect, progress);
            drawParticles(rect, motion, now);
          }
        }
        sendHotBounds(false);
      } else if (canvas.width && canvas.height) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
      }
      scheduleNextDraw();
    }
    function scheduleNextDraw() {
      if (overlayRenderPaused) return;
      if (!state.enabled) {
        setTimeout(function(){ requestAnimationFrame(draw); }, 250);
        return;
      }
      requestAnimationFrame(draw);
    }
    function normalizeFrameRate(value) {
      var n = Number(value);
      if (!isFinite(n) || n <= 0) return 0;
      if (n <= 26) return 24;
      if (n <= 45) return 30;
      if (n <= 90) return 60;
      return 120;
    }
    function frameIntervalMs() {
      var fps = normalizeFrameRate(state.frameRate);
      return fps > 0 ? 1000 / fps : 0;
    }
    function pointInRect(evt, rect, padX, padY) {
      return evt.clientX >= rect.left - padX && evt.clientX <= rect.right + padX && evt.clientY >= rect.top - padY && evt.clientY <= rect.bottom + padY;
    }
    function pointInLyric(evt) {
      return !!(state.enabled && evt && pointInRect(evt, lyricInteractionBounds(), 0, 0));
    }
    function pointInStage(evt) {
      if (!state.enabled || !evt) return false;
      if (dragging) return true;
      if (pointInLyric(evt)) return true;
      if (!hintVisible || !lockHint) return false;
      return pointInRect(evt, lockHint.getBoundingClientRect(), 10, 10);
    }
    function setHintVisible(visible) {
      hintVisible = !!visible;
      if (hintVisible) {
        positionInteractionHint();
        lastHintPositionAt = performance.now();
      } else {
        lastHintPositionAt = 0;
      }
      stage.classList.toggle('hint-visible', hintVisible);
      setPointerCapture(!isLocked() && (hintVisible || dragging) && hoverInside);
    }
    function hideInteractionHint() {
      hoverInside = false;
      lastPointerEvent = null;
      if (hintTimer) {
        clearTimeout(hintTimer);
        hintTimer = 0;
      }
      setHintVisible(false);
      stage.classList.remove('hover');
    }
    function scheduleInteractionHint() {
      if (hintVisible || hintTimer) return;
      hintTimer = setTimeout(function(){
        hintTimer = 0;
        if (!hoverInside || !lastPointerEvent || !pointInStage(lastPointerEvent)) return;
        setHintVisible(true);
      }, 1500);
    }
    function updateHover(evt) {
      var inside = !!state.enabled && pointInStage(evt);
      hoverInside = inside;
      lastPointerEvent = evt || lastPointerEvent;
      stage.classList.toggle('hover', inside || dragging);
      if (isLocked()) {
        if (inside || dragging) {
          scheduleInteractionHint();
        } else {
          hideInteractionHint();
        }
        setPointerCapture(false);
        return inside;
      }
      if (inside || dragging) {
        scheduleInteractionHint();
      } else {
        hideInteractionHint();
      }
      setPointerCapture(inside || dragging);
      return inside;
    }
    function setLocked(locked) {
      state.clickThrough = !!locked;
      syncLockClasses();
      if (window.desktopOverlay && window.desktopOverlay.setLyricsLockState) {
        window.desktopOverlay.setLyricsLockState(!!locked).catch(function(){});
      }
    }
    function moveDrag(evt) {
      if (dragging && !isLocked() && window.desktopOverlay && window.desktopOverlay.moveLyricsBy) {
        var dx = evt.screenX - dragLast.x;
        var dy = evt.screenY - dragLast.y;
        dragLast.x = evt.screenX;
        dragLast.y = evt.screenY;
        if (dx || dy) window.desktopOverlay.moveLyricsBy(dx, dy).catch(function(){});
      }
    }
    function endDrag(evt) {
      if (!dragging) return;
      if (evt && dragPointerId != null && evt.pointerId != null && evt.pointerId !== dragPointerId) return;
      try {
        if (dragPointerId != null && stage.releasePointerCapture && stage.hasPointerCapture && stage.hasPointerCapture(dragPointerId)) {
          stage.releasePointerCapture(dragPointerId);
        }
      } catch (e) {}
      dragging = false;
      dragPointerId = null;
      setPointerCapture(false);
    }
    window.addEventListener('pointermove', function(evt){
      if (dragging && evt.buttons != null && (evt.buttons & 1) === 0) {
        endDrag(evt);
        updateHover(evt);
        return;
      }
      updateHover(evt);
      moveDrag(evt);
    });
    window.addEventListener('mousemove', function(evt){
      if (!dragging) updateHover(evt);
    });
    window.addEventListener('pointerleave', function(){
      if (dragging) {
        setPointerCapture(true);
        return;
      }
      hideInteractionHint();
    });
    window.addEventListener('mouseleave', function(){
      if (!dragging) hideInteractionHint();
    });
    window.addEventListener('pointerdown', function(evt){
      if (evt.target && evt.target.closest && evt.target.closest('.lyrics-tool-btn')) return;
      if (!pointInLyric(evt)) return;
      if (evt.button === 1) {
        evt.preventDefault();
        hideInteractionHint();
        return;
      }
      if (isLocked()) {
        hideInteractionHint();
        setPointerCapture(false);
        return;
      }
      if (evt.button === 0 && !isLocked()) {
        dragging = true;
        dragPointerId = evt.pointerId;
        dragLast.x = evt.screenX;
        dragLast.y = evt.screenY;
        setPointerCapture(true);
        try {
          if (stage.setPointerCapture) stage.setPointerCapture(evt.pointerId);
        } catch (e) {}
        evt.preventDefault();
      }
    });
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    window.addEventListener('blur', function(){
      endDrag({ pointerId:dragPointerId });
      hideInteractionHint();
    });
    stage.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('auxclick', function(evt){
      if (evt.button === 1 && pointInLyric(evt)) evt.preventDefault();
    });
    function handleLyricsWheel(evt) {
      if (!evt || isLocked() || dragging || !pointInStage(evt)) return false;
      var deltaY = Number(evt.deltaY);
      if (!isFinite(deltaY) || Math.abs(deltaY) < .01) return false;
      evt.preventDefault();
      evt.stopPropagation();
      var now = performance.now();
      if (lastSizeWheelAt && now - lastSizeWheelAt < 70) return true;
      lastSizeWheelAt = now;
      requestLyricsSize(deltaY < 0 ? DESKTOP_LYRICS_SIZE_STEP : -DESKTOP_LYRICS_SIZE_STEP);
      setHintVisible(true);
      return true;
    }
    window.addEventListener('wheel', handleLyricsWheel, { passive:false });
    if (lockToggleBtn) {
      lockToggleBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        setLocked(!isLocked());
        setHintVisible(true);
      });
    }
    if (sizeDownBtn) {
      sizeDownBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestLyricsSize(-DESKTOP_LYRICS_SIZE_STEP);
        setHintVisible(true);
      });
    }
    if (sizeUpBtn) {
      sizeUpBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestLyricsSize(DESKTOP_LYRICS_SIZE_STEP);
        setHintVisible(true);
      });
    }
    function setOverlayRenderPaused(paused) {
      paused = !!paused;
      if (overlayRenderPaused === paused) return;
      overlayRenderPaused = paused;
      if (!paused) {
        lastDrawAt = 0;
        requestAnimationFrame(draw);
      }
    }
    document.addEventListener('visibilitychange', function(){ setOverlayRenderPaused(document.hidden); });
    if (glowDownBtn) {
      glowDownBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestLyricsGlowStrength(-DESKTOP_LYRICS_GLOW_STEP);
        setHintVisible(true);
      });
    }
    if (glowUpBtn) {
      glowUpBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestLyricsGlowStrength(DESKTOP_LYRICS_GLOW_STEP);
        setHintVisible(true);
      });
    }
    if (stableToggleBtn) {
      stableToggleBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestLyricsStable(state.stable !== true);
        setHintVisible(true);
      });
    }
    if (previousTrackBtn) {
      previousTrackBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestPlaybackCommand('previous');
        setHintVisible(true);
      });
    }
    if (playPauseBtn) {
      playPauseBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestPlaybackCommand('toggle-play');
        setHintVisible(true);
      });
    }
    if (nextTrackBtn) {
      nextTrackBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        requestPlaybackCommand('next');
        setHintVisible(true);
      });
    }
    if (closeLyricsBtn) {
      closeLyricsBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        state.enabled = false;
        document.body.classList.remove('show');
        setPointerCapture(false);
        if (window.desktopOverlay && window.desktopOverlay.closeLyrics) {
          window.desktopOverlay.closeLyrics().catch(function(){});
        }
      });
    }
    window.__mineradioDesktopLyricsApplyState = applyState;
    window.addEventListener('message', function(event){
      var data = event && event.data;
      if (!data || data.type !== 'mineradio-desktop-lyrics-state') return;
      applyState(data.payload || {});
    });
    window.addEventListener('resize', resize);
    resize();
    (function applyQueryState(){
      try {
        var raw = new URLSearchParams(window.location.search).get('state');
        if (raw) applyState(JSON.parse(raw));
      } catch (e) {}
    })();
    if (window.desktopOverlay && window.desktopOverlay.onLyricsState) {
      window.desktopOverlay.onLyricsState(applyState);
    }
    if (window.desktopOverlay && window.desktopOverlay.onLyricsWindowGeometry) {
      window.desktopOverlay.onLyricsWindowGeometry(function(payload) {
        desktopLyricsWindowTopInset = Math.max(0, Number(payload.topInset) || 0);
        desktopLyricsWindowBottomInset = Math.max(0, Number(payload.bottomInset) || 0);
        if (hintVisible) positionInteractionHint();
      });
    }
    requestAnimationFrame(draw);
  </script>
</body>
