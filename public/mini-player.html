<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio Mini Player</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #f4f7f8;
      user-select: none;
    }
    body { padding: 6px; }
    .mini-shell {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--th-mini-border, var(--th-popover-border, rgba(255, 255, 255, 0.13)));
      border-radius: 8px;
      background: var(--th-mini-bg, var(--th-popover-bg, rgba(9, 12, 15, 0.96)));
      box-shadow: var(--th-mini-shadow, 0 14px 38px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08));
      -webkit-app-region: drag;
      --mini-pulse: 0;
      --mini-glow: 0;
      --mini-radius: 12px;
      transition: background-color 220ms ease, border-color 220ms ease, box-shadow 220ms ease, padding 240ms cubic-bezier(.22,.8,.24,1);
    }
    .mini-shell[data-expand-direction="left"] { flex-direction: row-reverse; }
    .mini-shell[data-collapsed="true"] {
      gap: 0;
      padding: 0;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      -webkit-app-region: no-drag;
      pointer-events: none;
    }
    .mini-shell[data-collapsed="true"] .meta,
    .mini-shell[data-collapsed="true"] .transport,
    .mini-shell[data-collapsed="true"] .restore {
      opacity: 0;
      pointer-events: none;
      transform: translateX(10px) scale(0.94);
      flex-basis: 0;
      width: 0;
      min-width: 0;
    }
    .mini-shell[data-expand-direction="left"][data-collapsed="true"] .meta,
    .mini-shell[data-expand-direction="left"][data-collapsed="true"] .transport,
    .mini-shell[data-expand-direction="left"][data-collapsed="true"] .restore {
      transform: translateX(-10px) scale(0.94);
    }
    .mini-shell[data-collapsed="true"] .desktop-lyrics-toggle {
      opacity: 0;
      pointer-events: none;
    }
    .mini-shell[data-collapsed="true"] .transport {
      flex-basis: 0;
      width: 0;
      overflow: hidden;
      gap: 0;
    }
    .mini-shell[data-collapsed="true"] .restore {
      flex-basis: 0;
      width: 0;
      overflow: hidden;
      margin: 0;
    }
    .mini-shell[data-has-track="false"] .cover {
      opacity: 0.56;
      transform: scale(0.92);
    }
    .mini-shell[data-collapsed="true"] .cover {
      flex-basis: 54px;
      width: 54px;
      height: 54px;
      margin: 0;
      border-radius: var(--mini-radius);
      pointer-events: auto;
      -webkit-app-region: no-drag;
      /* 收回态封面右侧只剩 6px 透明余量，54px 封面最多外扩 5.27px，所以放大上限锁在 0.195。 */
      transform: scale(calc(1 + var(--mini-pulse) * 0.195));
    }
    .cover {
      position: relative;
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      overflow: hidden;
      border: 1px solid var(--th-mini-cover-border, var(--th-row-border, rgba(255, 255, 255, 0.12)));
      border-radius: var(--mini-radius);
      background: var(--th-mini-cover-bg, var(--th-row-bg, #151b20));
      box-shadow:
        inset 0 0 0 1px rgba(110, 231, 216, 0.06),
        0 0 calc(6px + var(--mini-glow) * 14px) rgba(110, 231, 216, calc(0.08 + var(--mini-glow) * 0.42)),
        0 0 calc(12px + var(--mini-glow) * 18px) rgba(86, 153, 255, calc(0.025 + var(--mini-glow) * 0.2));
      cursor: grab;
      -webkit-app-region: no-drag;
      touch-action: none;
      transform-origin: center;
      transform: scale(calc(1 + var(--mini-pulse) * 0.125));
      transition: flex-basis 240ms cubic-bezier(.22,.8,.24,1), width 240ms cubic-bezier(.22,.8,.24,1), height 240ms cubic-bezier(.22,.8,.24,1), margin 240ms cubic-bezier(.22,.8,.24,1), border-radius 240ms ease, opacity 180ms ease, transform 90ms cubic-bezier(.2,.72,.28,1), box-shadow 110ms ease;
    }
    .cover.dragging { cursor: grabbing; }
    .cover::after {
      content: "";
      position: absolute;
      inset: 1px;
      border: 1px solid rgba(180, 255, 239, calc(0.12 + var(--mini-glow) * 0.6));
      border-radius: inherit;
      box-shadow: inset 0 0 calc(4px + var(--mini-glow) * 12px) rgba(110, 231, 216, calc(0.06 + var(--mini-glow) * 0.34));
      opacity: var(--mini-glow-opacity, 1);
      transition: border-color 90ms ease, box-shadow 110ms ease, opacity 180ms ease;
      pointer-events: none;
    }
    .mini-shell[data-glow="false"] .cover { box-shadow: inset 0 0 0 1px rgba(110, 231, 216, 0.04); }
    .mini-shell[data-glow="false"] .cover::after { opacity: 0; }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      -webkit-user-drag: none;
      transition: opacity 160ms ease;
    }
    .cover.ready img { opacity: 1; }
    .cover-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--th-mini-cover-text, #e5c98a);
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 700;
    }
    .meta {
      min-width: 0;
      flex: 1 1 auto;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      transition: opacity 190ms ease, transform 240ms cubic-bezier(.22,.8,.24,1), flex-basis 240ms cubic-bezier(.22,.8,.24,1), width 240ms cubic-bezier(.22,.8,.24,1), min-width 240ms cubic-bezier(.22,.8,.24,1);
    }
    .title, .artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0;
    }
    .title {
      color: var(--th-mini-title, var(--th-text-strong, #f7fafb));
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
    }
    .artist {
      color: var(--th-mini-artist, var(--th-text-dim, rgba(226, 234, 237, 0.54)));
      font-size: 9.5px;
      line-height: 1.2;
    }
    .transport {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 28px 34px 28px;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
      transition: opacity 190ms ease, transform 240ms cubic-bezier(.22,.8,.24,1), flex-basis 240ms cubic-bezier(.22,.8,.24,1), width 240ms cubic-bezier(.22,.8,.24,1);
    }
    button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--th-mini-btn-border, var(--th-chip-border, rgba(255, 255, 255, 0.1)));
      border-radius: 6px;
      background: var(--th-mini-btn-bg, var(--th-chip-bg, #151a1f));
      color: var(--th-mini-btn-text, var(--th-text-dim, rgba(244, 248, 249, 0.78)));
      cursor: pointer;
      outline: none;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
      -webkit-app-region: no-drag;
    }
    button:hover:not(:disabled) {
      border-color: var(--th-mini-btn-hover-border, var(--th-chip-hover-border, rgba(110, 231, 216, 0.42)));
      background: var(--th-mini-btn-hover-bg, var(--th-chip-hover-bg, #1b2428));
      color: var(--th-mini-btn-hover-text, #ffffff);
    }
    button:active:not(:disabled) { transform: scale(0.94); }
    button:focus-visible { box-shadow: 0 0 0 2px rgba(110, 231, 216, 0.34); }
    button:disabled { opacity: 0.32; cursor: default; }
    button svg { width: 15px; height: 15px; pointer-events: none; }
    .play-toggle {
      width: 34px;
      height: 34px;
      border-color: var(--th-mini-play-border, rgba(110, 231, 216, 0.3));
      background: var(--th-mini-play-bg, #172326);
      color: var(--th-mini-play-text, #a9fff2);
    }
    .play-toggle svg { width: 17px; height: 17px; }
    .desktop-lyrics-toggle {
      position: absolute;
      right: 5px;
      bottom: 4px;
      width: 18px;
      height: 18px;
      border-color: transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--th-mini-ghost-text, var(--th-text-dim, rgba(225, 232, 235, 0.54)));
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      z-index: 2;
      transition: opacity 190ms ease, color 140ms ease;
    }
    .mini-shell[data-expand-direction="left"] .desktop-lyrics-toggle {
      left: 5px;
      right: auto;
    }
    .desktop-lyrics-toggle:hover:not(:disabled) {
      border-color: transparent;
      background: transparent;
      color: #dffffa;
    }
    .desktop-lyrics-toggle.active {
      border-color: transparent;
      background: transparent;
      color: #a9fff2;
      text-shadow: 0 0 6px rgba(110, 231, 216, 0.38);
    }
    .desktop-lyrics-glyph { pointer-events: none; }
    .pause-icon { display: none; }
    body[data-playing="true"] .play-icon { display: none; }
    body[data-playing="true"] .pause-icon { display: block; }
    .restore {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      align-self: flex-start;
      margin: -1px -1px 0 0;
      border-color: transparent;
      background: transparent;
      color: var(--th-mini-ghost-text, var(--th-text-dim, rgba(225, 232, 235, 0.48)));
      -webkit-app-region: no-drag;
      transition: opacity 190ms ease, transform 240ms cubic-bezier(.22,.8,.24,1), flex-basis 240ms cubic-bezier(.22,.8,.24,1), width 240ms cubic-bezier(.22,.8,.24,1), background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .mini-shell[data-expand-direction="left"] .restore { margin: -1px 0 0 -1px; }
    .mini-shell[data-expand-direction="left"][data-collapsed="true"] .restore { margin: 0; }
    .restore svg { width: 13px; height: 13px; }
    .mini-shell[data-instant="true"],
    .mini-shell[data-instant="true"] .cover,
    .mini-shell[data-instant="true"] .cover::after,
    .mini-shell[data-instant="true"] .cover img,
    .mini-shell[data-instant="true"] .meta,
    .mini-shell[data-instant="true"] .transport,
    .mini-shell[data-instant="true"] .restore,
    .mini-shell[data-instant="true"] button { transition: none !important; }
    /* 主界面收缩落地前窗口是隐藏的预热窗口，外壳先留白，等窗口显示且首帧状态到位再淡入，
       这样迷你播放器不会闪一下「Mineradio / 等待播放」占位文案。 */
    body[data-enter="pending"] .mini-shell { opacity: 0; }
    body[data-enter="run"] .mini-shell { animation: mini-shell-enter 280ms cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes mini-shell-enter {
      from { opacity: 0; transform: translateY(7px) scale(0.9); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      body[data-enter="run"] .mini-shell { animation: none; }
      .mini-shell, .cover, .cover::after, .cover img, .meta, .transport, .restore, button { transition: none; }
    }
  </style>
</head>
<body data-playing="false" data-enter="pending">
  <main class="mini-shell" id="mini-shell" data-collapsed="true" data-expand-direction="right" data-has-track="false" data-glow="true" aria-label="Mineradio 迷你播放器">
    <div class="cover" id="cover-wrap" role="button" tabindex="0" aria-label="展开迷你播放器" aria-expanded="false">
      <span class="cover-fallback">M</span>
      <img id="cover" alt="" draggable="false">
    </div>
    <div class="meta">
      <div class="title" id="title">Mineradio</div>
      <div class="artist" id="artist">等待播放</div>
    </div>
    <div class="transport">
      <button id="previous" type="button" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="play" class="play-toggle" type="button" title="播放" aria-label="播放">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <button id="next" type="button" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
      </button>
    </div>
    <!-- 桌面歌词按钮必须挂在 .mini-shell 直属层：.transport 收回时带 transform 会变成绝对定位包含块，把它拽到面板中间并被 overflow 裁切。 -->
    <button id="desktop-lyrics" class="desktop-lyrics-toggle" type="button" title="开启桌面歌词" aria-label="开启桌面歌词" aria-pressed="false">
      <span class="desktop-lyrics-glyph" aria-hidden="true">词</span>
    </button>
    <button id="restore" class="restore" type="button" title="返回主界面" aria-label="返回主界面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
  </main>
  <script>
    'use strict';
    var miniShell = document.getElementById('mini-shell');
    var coverWrap = document.getElementById('cover-wrap');
    var cover = document.getElementById('cover');
    var title = document.getElementById('title');
    var artist = document.getElementById('artist');
    var playButton = document.getElementById('play');
    var desktopLyricsButton = document.getElementById('desktop-lyrics');
    var controls = [document.getElementById('previous'), playButton, document.getElementById('next')];
    var lastCover = '';
    var miniState = { title:'Mineradio', artist:'', cover:'', playing:false, hasTrack:false, desktopLyrics:false, pulse:0, expandDirection:'right', visual:{ pulseEnabled:true, pulseStrength:1, glowEnabled:true, glowStrength:1, hoverExpand:true, radius:12 } };
    var MINI_EFFECT_STRENGTH_MAX = 3;
    var renderedPlaying = null;
    var renderedHasTrack = null;
    var renderedHoverExpand = null;
    var renderedExpandDirection = null;
    var hoverTimer = 0;
    var coverDrag = null;
    var suppressCoverClick = false;
    var suppressCoverClickTimer = 0;
    var receivedExternalState = false;
    var COVER_HOT_REGION_PADDING = 6;
    var pointerInCoverHotRegion = false;
    var pointerPassthrough = null;

    /**
     * 读取封面律动/光晕强度档位，缺失或非法时回落到标准力度 1.00。
     * @param {unknown} value 主进程下发的强度值。
     * @returns {number} 0 ~ MINI_EFFECT_STRENGTH_MAX 之间的强度。
     */
    function readMiniEffectStrength(value) {
      var strength = Number(value);
      if (!isFinite(strength)) strength = 1;
      return Math.max(0, Math.min(MINI_EFFECT_STRENGTH_MAX, strength));
    }

    /**
     * 把 0 ~ 3 的强度档位压成 0 ~ 1 的驱动值。饱和曲线保证 1.00 已经明显，
     * 3.00 逼近但不超过收回态窗口留给封面的几何余量。
     * @param {number} level 信号乘强度后的原始档位。
     * @returns {number} 0 ~ 1 的 CSS 驱动值。
     */
    function saturateMiniEffect(level) {
      if (!(level > 0)) return 0;
      return 1 - Math.exp(-1.15 * level);
    }

    /**
     * 忽略窗口移动 IPC 失败，避免拖动结束后留下未处理的 rejected promise。
     * @returns {void}
     */
    function ignoreMiniPlayerMoveFailure() {}

    /**
     * 规范化主进程传来的展开方向。
     * @param {unknown} value 原始方向值。
     * @returns {'left'|'right'} 仅允许的展开方向。
     */
    function normalizeExpandDirection(value) {
      return value === 'left' ? 'left' : 'right';
    }

    /**
     * 把展开方向写入稳定的 DOM 状态，只有方向变化时才触发布局切换。
     * @param {unknown} value 主进程传来的方向值。
     * @returns {void}
     */
    function syncExpandDirection(value) {
      var direction = normalizeExpandDirection(value);
      if (renderedExpandDirection === direction) return;
      renderedExpandDirection = direction;
      miniShell.setAttribute('data-expand-direction', direction);
    }

    /**
     * 读取指针的屏幕坐标，拖动窗口时不能使用随窗口变化的本地坐标。
     * @param {object} event 指针事件。
     * @param {'screenX'|'screenY'} key 坐标字段名。
     * @returns {number|null} 有效屏幕坐标，无效时返回 null。
     */
    function pointerScreenCoordinate(event, key) {
      var value = Number(event && event[key]);
      return isFinite(value) ? value : null;
    }

    /**
     * 请求主进程按增量移动迷你播放器窗口。
     * @param {number} dx 水平位移。
     * @param {number} dy 垂直位移。
     * @param {boolean} commit 是否为拖动结束并保存最终坐标。
     * @returns {void}
     */
    function moveMiniPlayerWindowBy(dx, dy, commit) {
      if (!window.miniPlayer || typeof window.miniPlayer.moveBy !== 'function') return;
      window.miniPlayer.moveBy(dx, dy, commit === true).catch(ignoreMiniPlayerMoveFailure);
    }

    function sendCommand(action) {
      if (!window.miniPlayer || typeof window.miniPlayer.command !== 'function') return;
      window.miniPlayer.command(action).catch(function(){});
    }

    function hoverExpandEnabled() {
      return !miniState.visual || miniState.visual.hoverExpand !== false;
    }

    function clearCollapseTimer() {
      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = 0;
    }

    /**
     * 判断当前是否仍有悬停、聚焦或封面拖动交互，避免交互中自动收回。
     * @returns {boolean} 仍在交互中时返回 true。
     */
    function expansionInteractionActive() {
      return !!coverDrag || coverWrap.matches(':hover') || miniShell.matches(':focus-within');
    }

    /**
     * 判断收回态是否应该让出窗口鼠标事件。收回后只有封面热区需要命中，
     * 其余透明区域必须交还桌面，不能继续吞掉点击或被误拖动。
     * @returns {boolean} 需要鼠标穿透时返回 true。
     */
    function shouldPassPointerThrough() {
      if (!hoverExpandEnabled()) return false;
      if (miniShell.getAttribute('data-collapsed') !== 'true') return false;
      if (coverDrag) return false;
      return !pointerInCoverHotRegion;
    }

    /**
     * 把窗口鼠标穿透状态同步给主进程，状态未变化时不重复发送 IPC。
     * @returns {void}
     */
    function syncPointerPassthrough() {
      var next = shouldPassPointerThrough();
      if (next === pointerPassthrough) return;
      pointerPassthrough = next;
      if (!window.miniPlayer || typeof window.miniPlayer.setPointerPassthrough !== 'function') return;
      window.miniPlayer.setPointerPassthrough(next).catch(ignoreMiniPlayerMoveFailure);
    }

    /**
     * 判断转发坐标是否落在封面热区内。穿透期间只有转发的 mousemove 坐标可用，
     * 不能依赖封面自身的命中测试。
     * @param {object} event 鼠标或指针事件。
     * @returns {boolean} 命中封面热区时返回 true。
     */
    function pointerInCoverHotRegionAt(event) {
      if (!event || typeof coverWrap.getBoundingClientRect !== 'function') return false;
      var x = Number(event.clientX);
      var y = Number(event.clientY);
      if (!isFinite(x) || !isFinite(y)) return false;
      var rect = coverWrap.getBoundingClientRect();
      if (!rect || rect.right <= rect.left || rect.bottom <= rect.top) return false;
      return x >= rect.left - COVER_HOT_REGION_PADDING
        && x <= rect.right + COVER_HOT_REGION_PADDING
        && y >= rect.top - COVER_HOT_REGION_PADDING
        && y <= rect.bottom + COVER_HOT_REGION_PADDING;
    }

    /**
     * 用转发坐标维护封面热区命中状态：进入热区先恢复窗口交互并展开，离开热区恢复穿透。
     * @param {object} event 鼠标或指针事件。
     * @returns {void}
     */
    function trackCoverHotRegion(event) {
      var inside = pointerInCoverHotRegionAt(event);
      if (inside === pointerInCoverHotRegion) return;
      pointerInCoverHotRegion = inside;
      syncPointerPassthrough();
      if (inside) expandFromInteraction();
      else if (!coverDrag && !miniShell.matches(':hover')) scheduleCollapse();
    }

    /**
     * 指针离开窗口后清除热区标记，收回态立即恢复鼠标穿透。
     * @returns {void}
     */
    function clearCoverHotRegion() {
      if (!pointerInCoverHotRegion) return;
      pointerInCoverHotRegion = false;
      syncPointerPassthrough();
    }

    /**
     * 切换迷你播放器的完整面板与封面收回态。
     * @param {boolean} next 是否显示完整面板。
     * @param {boolean} immediate 是否跳过本次过渡动画。
     * @returns {void}
     */
    function setExpanded(next, immediate) {
      if (!hoverExpandEnabled()) next = true;
      next = !!next;
      if (immediate) miniShell.setAttribute('data-instant', 'true');
      miniShell.setAttribute('data-collapsed', next ? 'false' : 'true');
      coverWrap.setAttribute('aria-expanded', next ? 'true' : 'false');
      coverWrap.setAttribute('aria-label', hoverExpandEnabled()
        ? (next ? '迷你播放器已展开' : '展开迷你播放器')
        : '完整迷你播放器');
      syncPointerPassthrough();
      if (immediate) {
        window.requestAnimationFrame(function(){ miniShell.removeAttribute('data-instant'); });
      }
    }

    function syncHoverExpandMode(immediate) {
      clearCollapseTimer();
      miniShell.setAttribute('data-hover-expand', hoverExpandEnabled() ? 'true' : 'false');
      setExpanded(hoverExpandEnabled() ? expansionInteractionActive() : true, immediate);
    }

    function expandFromInteraction() {
      clearCollapseTimer();
      if (hoverExpandEnabled()) setExpanded(true);
    }

    function scheduleCollapse() {
      clearCollapseTimer();
      if (!hoverExpandEnabled()) return;
      hoverTimer = setTimeout(function(){
        hoverTimer = 0;
        if (!expansionInteractionActive()) setExpanded(false);
      }, 420);
    }

    function setCover(src) {
      src = String(src || '');
      if (src === lastCover) return;
      lastCover = src;
      coverWrap.classList.remove('ready');
      if (!src) {
        cover.removeAttribute('src');
        return;
      }
      cover.src = src;
    }

    /**
     * 清除拖动后的单次点击抑制标记，避免浏览器不派发 click 时吞掉下一次正常点击。
     * @returns {void}
     */
    function clearCoverClickSuppression() {
      suppressCoverClick = false;
      suppressCoverClickTimer = 0;
    }

    /**
     * 在封面发生实际拖动后抑制紧随其后的合成 click 事件。
     * @returns {void}
     */
    function suppressCoverClickOnce() {
      suppressCoverClick = true;
      if (suppressCoverClickTimer) clearTimeout(suppressCoverClickTimer);
      suppressCoverClickTimer = setTimeout(clearCoverClickSuppression, 0);
    }

    /**
     * 开始记录封面指针拖动，屏幕坐标用于抵消窗口移动后的本地坐标变化。
     * @param {object} event 指针按下事件。
     * @returns {void}
     */
    function beginCoverDrag(event) {
      if (!event || event.button !== 0) return;
      var screenX = pointerScreenCoordinate(event, 'screenX');
      var screenY = pointerScreenCoordinate(event, 'screenY');
      if (screenX === null || screenY === null) return;
      coverDrag = {
        pointerId: event.pointerId,
        startX: screenX,
        startY: screenY,
        lastX: screenX,
        lastY: screenY,
        moved: false,
      };
      syncPointerPassthrough();
      if (typeof coverWrap.setPointerCapture === 'function' && event.pointerId !== undefined) {
        try { coverWrap.setPointerCapture(event.pointerId); } catch (_error) {}
      }
    }

    /**
     * 把超过点击阈值的封面位移按增量发送给主进程。
     * @param {object} event 指针移动事件。
     * @returns {void}
     */
    function updateCoverDrag(event) {
      if (!coverDrag || !event || event.pointerId !== coverDrag.pointerId) return;
      var screenX = pointerScreenCoordinate(event, 'screenX');
      var screenY = pointerScreenCoordinate(event, 'screenY');
      if (screenX === null || screenY === null) return;
      var totalDx = screenX - coverDrag.startX;
      var totalDy = screenY - coverDrag.startY;
      if (!coverDrag.moved && Math.max(Math.abs(totalDx), Math.abs(totalDy)) < 5) return;
      var dx = Math.round(screenX - coverDrag.lastX);
      var dy = Math.round(screenY - coverDrag.lastY);
      coverDrag.lastX = screenX;
      coverDrag.lastY = screenY;
      coverDrag.moved = true;
      coverWrap.classList.add('dragging');
      if (dx || dy) moveMiniPlayerWindowBy(dx, dy);
      if (event.preventDefault) event.preventDefault();
    }

    /**
     * 结束封面拖动并在必要时阻止浏览器把拖动误判为点击。
     * @param {object} event 指针结束事件。
     * @returns {void}
     */
    function finishCoverDrag(event) {
      if (!coverDrag || (event && event.pointerId !== undefined && event.pointerId !== coverDrag.pointerId)) return;
      var moved = coverDrag.moved;
      var pointerId = coverDrag.pointerId;
      coverDrag = null;
      coverWrap.classList.remove('dragging');
      if (typeof coverWrap.releasePointerCapture === 'function' && pointerId !== undefined) {
        try { coverWrap.releasePointerCapture(pointerId); } catch (_error) {}
      }
      if (moved) {
        moveMiniPlayerWindowBy(0, 0, true);
        suppressCoverClickOnce();
      }
      syncPointerPassthrough();
      if (!miniShell.matches(':hover')) scheduleCollapse();
    }

    /**
     * 区分封面短按与拖动后的合成点击，短按仍触发展开。
     * @param {object} event 点击事件。
     * @returns {void}
     */
    function handleCoverClick(event) {
      if (suppressCoverClick) {
        clearCoverClickSuppression();
        if (event && event.preventDefault) event.preventDefault();
        return;
      }
      expandFromInteraction();
    }

    // 已经写到 documentElement 上的主题变量名。换主题时要把不再出现的那些擦掉，
    // 不然旧主题的颜色会残留在没被新主题覆盖的那几个变量上。
    var appliedThemeVars = [];

    /**
     * 把主进程转发过来的 --th-* 变量写到根元素上。主窗口那边已经清洗过两轮，
     * 这里只做名字前缀校验，值直接交给 CSSOM——setProperty 本身会拒收非法声明。
     * @param {Object<string,string>} vars 变量名到值。
     * @returns {void}
     */
    function applyMiniThemeVars(vars) {
      var root = document.documentElement;
      var next = vars && typeof vars === 'object' ? vars : {};
      var names = [];
      for (var i = 0; i < appliedThemeVars.length; i++) {
        if (!Object.prototype.hasOwnProperty.call(next, appliedThemeVars[i])) root.style.removeProperty(appliedThemeVars[i]);
      }
      var keys = Object.keys(next);
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].indexOf('--th-') !== 0) continue;
        root.style.setProperty(keys[j], String(next[keys[j]] == null ? '' : next[keys[j]]));
        names.push(keys[j]);
      }
      appliedThemeVars = names;
    }

    /**
     * 应用主进程发送的歌曲、播放、视觉和展开方向状态。
     * @param {object} patch 增量状态补丁。
     * @param {boolean} immediate 是否跳过首次渲染过渡。
     * @returns {void}
     */
    function applyState(patch, immediate) {
      patch = patch || {};
      miniState = Object.assign({}, miniState, patch);
      var next = miniState;
      var hasTrack = next.hasTrack === true;
      var playing = hasTrack && next.playing === true;
      miniShell.setAttribute('data-has-track', hasTrack ? 'true' : 'false');
      coverWrap.setAttribute('aria-hidden', hasTrack ? 'false' : 'true');
      var nextTitle = hasTrack ? String(next.title || '未知歌曲') : 'Mineradio';
      var nextArtist = hasTrack ? String(next.artist || '本地音乐') : '等待播放';
      if (title.textContent !== nextTitle) title.textContent = nextTitle;
      if (artist.textContent !== nextArtist) artist.textContent = nextArtist;
      title.title = nextTitle;
      artist.title = nextArtist;
      if (renderedPlaying !== playing) {
        renderedPlaying = playing;
        document.body.setAttribute('data-playing', playing ? 'true' : 'false');
        playButton.title = playing ? '暂停' : '播放';
        playButton.setAttribute('aria-label', playButton.title);
      }
      if (renderedHasTrack !== hasTrack) {
        renderedHasTrack = hasTrack;
        for (var i = 0; i < controls.length; i++) controls[i].disabled = !hasTrack;
      }
      var desktopLyricsEnabled = next.desktopLyrics === true;
      desktopLyricsButton.classList.toggle('active', desktopLyricsEnabled);
      desktopLyricsButton.setAttribute('aria-pressed', desktopLyricsEnabled ? 'true' : 'false');
      desktopLyricsButton.title = desktopLyricsEnabled ? '关闭桌面歌词' : '开启桌面歌词';
      desktopLyricsButton.setAttribute('aria-label', desktopLyricsButton.title);
      syncExpandDirection(next.expandDirection);
      if (Object.prototype.hasOwnProperty.call(patch, 'themeVars')) applyMiniThemeVars(patch.themeVars);
      var visual = next.visual || {};
      var pulseSignal = Math.max(0, Math.min(1, Number(next.pulse) || 0));
      var signal = Math.pow(pulseSignal, 0.72);
      // 强度是 0~3 的用户档位：1.00 已经明显，3.00 通过饱和曲线逼近窗口几何上限，
      // 再往上也不会把封面和光晕顶出 360 × 84 的透明窗口。0 或关掉开关都等于停用。
      var pulse = visual.pulseEnabled === false ? 0 : saturateMiniEffect(signal * readMiniEffectStrength(visual.pulseStrength));
      var glow = visual.glowEnabled === false ? 0 : saturateMiniEffect(signal * readMiniEffectStrength(visual.glowStrength));
      miniShell.style.setProperty('--mini-pulse', pulse.toFixed(3));
      miniShell.style.setProperty('--mini-glow', glow.toFixed(3));
      miniShell.style.setProperty('--mini-radius', Math.max(4, Math.min(22, Number(visual.radius) || 12)) + 'px');
      miniShell.setAttribute('data-glow', visual.glowEnabled === false ? 'false' : 'true');
      var hoverExpand = visual.hoverExpand !== false;
      if (renderedHoverExpand !== hoverExpand) {
        renderedHoverExpand = hoverExpand;
        syncHoverExpandMode(immediate === true);
      }
      setCover(hasTrack ? next.cover : '');
    }

    function receiveState(patch) {
      applyState(patch, !receivedExternalState);
      receivedExternalState = true;
      miniEnterStateReady = true;
      runMiniEnterAnimation();
    }

    // 入场动画只跑一次，条件是窗口已经显示且首帧状态到位。
    // 预热窗口在主界面收缩期间是隐藏的，document.visibilityState 会在窗口显示时转为 visible。
    var miniEnterDone = false;
    var miniEnterStateReady = false;
    var miniEnterGraceTimer = 0;

    /**
     * 在窗口可见且状态就绪时播放一次外壳淡入。降低动效偏好只做即时显示。
     * @returns {void}
     */
    function runMiniEnterAnimation() {
      if (miniEnterDone) return;
      if (document.visibilityState === 'hidden') return;
      if (!miniEnterStateReady) {
        if (!miniEnterGraceTimer) {
          miniEnterGraceTimer = setTimeout(function(){
            miniEnterGraceTimer = 0;
            miniEnterStateReady = true;
            runMiniEnterAnimation();
          }, 160);
        }
        return;
      }
      miniEnterDone = true;
      if (miniEnterGraceTimer) {
        clearTimeout(miniEnterGraceTimer);
        miniEnterGraceTimer = 0;
      }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.body.removeAttribute('data-enter');
        return;
      }
      document.body.setAttribute('data-enter', 'run');
      setTimeout(function(){ document.body.removeAttribute('data-enter'); }, 320);
    }

    document.addEventListener('visibilitychange', runMiniEnterAnimation);
    // 兜底：任何情况下都不允许外壳因为等待入场条件而长期不可见。
    setTimeout(function(){
      if (miniEnterDone) return;
      miniEnterDone = true;
      document.body.removeAttribute('data-enter');
    }, 1500);

    cover.addEventListener('load', function(){
      if (cover.getAttribute('src')) coverWrap.classList.add('ready');
    });
    cover.addEventListener('error', function(){
      coverWrap.classList.remove('ready');
      // 失败地址需要释放缓存标记，后续播放状态同步才能重新触发加载。
      if (cover.getAttribute('src') === lastCover) {
        lastCover = '';
        cover.removeAttribute('src');
      }
    });
    coverWrap.addEventListener('mouseenter', function(){
      expandFromInteraction();
    });
    coverWrap.addEventListener('mouseleave', function(){
      if (!miniShell.matches(':hover')) scheduleCollapse();
    });
    coverWrap.addEventListener('focus', expandFromInteraction);
    coverWrap.addEventListener('pointerdown', beginCoverDrag);
    coverWrap.addEventListener('pointermove', updateCoverDrag);
    coverWrap.addEventListener('pointerup', finishCoverDrag);
    coverWrap.addEventListener('pointercancel', finishCoverDrag);
    coverWrap.addEventListener('lostpointercapture', finishCoverDrag);
    coverWrap.addEventListener('click', handleCoverClick);
    coverWrap.addEventListener('keydown', function(event){
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        expandFromInteraction();
      }
    });
    miniShell.addEventListener('mouseleave', scheduleCollapse);
    miniShell.addEventListener('mouseenter', function(){
      clearCollapseTimer();
    });
    miniShell.addEventListener('focusin', expandFromInteraction);
    miniShell.addEventListener('focusout', scheduleCollapse);
    document.addEventListener('mousemove', trackCoverHotRegion);
    document.addEventListener('mouseleave', clearCoverHotRegion);
    document.getElementById('previous').addEventListener('click', function(){ sendCommand('previous'); });
    playButton.addEventListener('click', function(){ sendCommand('toggle-play'); });
    document.getElementById('next').addEventListener('click', function(){ sendCommand('next'); });
    desktopLyricsButton.addEventListener('click', function(){ sendCommand('toggle-desktop-lyrics'); });
    document.getElementById('restore').addEventListener('click', function(){ sendCommand('restore'); });
    document.getElementById('mini-shell').addEventListener('dblclick', function(event){
      if (!event.target.closest('button')) sendCommand('restore');
    });
    if (window.miniPlayer && typeof window.miniPlayer.onState === 'function') window.miniPlayer.onState(receiveState);
    applyState({}, true);
    runMiniEnterAnimation();
  </script>
</body>
</html>
