<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio Wallpaper</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}
    canvas{position:absolute;inset:0;width:100%;height:100%}
  </style>
</head>
<body>
  <canvas id="wall"></canvas>
  <script src="wallpaper-effect.js"></script>
  <script>
    'use strict';
    // 画面实现与播放器内背景板共用 wallpaper-effect.js，这里只负责接收主进程状态。
    var wallpaperEffect = window.createMineradioWallpaperEffect(document.getElementById('wall'));
    if (window.desktopOverlay && window.desktopOverlay.onWallpaperState) {
      window.desktopOverlay.onWallpaperState(wallpaperEffect.applyState);
    }
  </script>
</body>
</html>
