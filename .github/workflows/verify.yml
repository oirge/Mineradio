name: Verify

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor-src/folia/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install Folia build dependencies
        run: npm ci --prefix vendor-src/folia --ignore-scripts --no-audit --no-fund
      - name: Build embedded Folia
        run: npm run build:folia
      - name: Save embedded Folia build
        uses: actions/upload-artifact@v4
        with:
          name: folia-static
          path: public/vendor/folia/
          if-no-files-found: error
          retention-days: 7
      - name: Check document encoding
        run: node --test tests/doc-encoding-integrity.test.js
      - name: Check embedded Folia types and behavior
        run: |
          npm run typecheck --prefix vendor-src/folia
          npm test --prefix vendor-src/folia -- test/unit/mineradio
      - run: node --test --test-concurrency=1 tests/*.test.js tests/*.test.mjs
      - run: |
          node --check desktop/main.js
          node --check desktop/overlay-preload.js
          node --check server.js
          node --check public/app.js
          node --check scripts/build-folia.js
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ui.txt
      - name: Install browser test runtime
        run: |
          python -m pip install -r scripts/requirements-ui.txt
          python -m playwright install chromium
      - name: Verify bilingual UI and Folia recovery
        timeout-minutes: 15
        run: python scripts/verify-browser-ui.py
      - name: Save browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-evidence
          path: artifacts/ui-language/
          if-no-files-found: ignore
          retention-days: 7
