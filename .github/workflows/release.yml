name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.3)'
        required: true
        default: 'v2.0.3'

jobs:
  build-windows:
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release metadata
        id: release_meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:REF_NAME } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag 格式无效：$tag"
          }
          if ($tag -ne "v$version") {
            throw "Release tag $tag 与 package.json 版本 $version 不一致"
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Windows installer
        run: npm run build:win -- --publish never
      
      - name: Generate SHA256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          cd dist
          $version = "${{ steps.release_meta.outputs.VERSION }}"
          $files = @(
            "Mineradio-oirge-$version-Setup.exe",
            "Mineradio-oirge-$version-Setup.exe.blockmap",
            "latest.yml"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "构建资产缺失：$file"
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash *$file"
          }
          $checksumPath = "Mineradio-oirge-$version-SHA256SUMS.txt"
          $content = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText(
            $checksumPath,
            $content,
            [Text.UTF8Encoding]::new($false)
          )
        shell: pwsh
      
      - name: Upload release assets
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $tag = "${{ steps.release_meta.outputs.TAG }}"
          $version = "${{ steps.release_meta.outputs.VERSION }}"
          $assets = @(
            "dist/Mineradio-oirge-$version-Setup.exe",
            "dist/Mineradio-oirge-$version-Setup.exe.blockmap",
            "dist/latest.yml",
            "dist/Mineradio-oirge-$version-SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "待上传资产缺失：$asset"
            }
          }

          function Get-TagReleases {
            $releaseIds = @(
              gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
                --jq ".[] | select(.tag_name == `"$tag`") | .id"
            )
            if ($LASTEXITCODE -ne 0) {
              throw "查询 Release 失败，退出码：$LASTEXITCODE"
            }
            return @($releaseIds | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          }

          $releases = @(Get-TagReleases)
          if ($releases.Count -gt 1) {
            throw "标签 $tag 已有 $($releases.Count) 个 Release，请先人工合并重复项"
          }
          if ($releases.Count -eq 0) {
            gh release create $tag `
              --draft `
              --verify-tag `
              --title $tag `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create 失败，退出码：$LASTEXITCODE"
            }
          } else {
            Write-Host "Reusing existing release $tag..."
          }

          Write-Host "Uploading assets to release $tag..."

          gh release upload $tag `
            "dist/Mineradio-oirge-$version-Setup.exe" `
            "dist/Mineradio-oirge-$version-Setup.exe.blockmap" `
            "dist/latest.yml" `
            "dist/Mineradio-oirge-$version-SHA256SUMS.txt" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload 失败，退出码：$LASTEXITCODE"
          }
          
          Write-Host "✅ All assets uploaded successfully!"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
