name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.8.1)'
        required: true
        default: 'v1.8.1'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release metadata
        id: release_meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:REF_NAME } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag 格式无效：$tag"
          }
          if ($tag -ne "v$version") {
            throw "Release tag $tag 与 package.json 版本 $version 不一致"
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate SHA256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          cd dist
          $version = "${{ steps.release_meta.outputs.VERSION }}"
          $files = @(
            "Mineradio-$version-Setup.exe",
            "Mineradio-$version-Setup.exe.blockmap",
            "latest.yml"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "构建资产缺失：$file"
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash *$file"
          }
          $lines | Out-File -FilePath "Mineradio-$version-SHA256SUMS.txt" -Encoding utf8
        shell: pwsh
      
      - name: Upload release assets
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $tag = "${{ steps.release_meta.outputs.TAG }}"
          $version = "${{ steps.release_meta.outputs.VERSION }}"
          $assets = @(
            "dist/Mineradio-$version-Setup.exe",
            "dist/Mineradio-$version-Setup.exe.blockmap",
            "dist/latest.yml",
            "dist/Mineradio-$version-SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "待上传资产缺失：$asset"
            }
          }
          
          Write-Host "Uploading assets to release $tag..."
          
          gh release upload $tag `
            "dist/Mineradio-$version-Setup.exe" `
            "dist/Mineradio-$version-Setup.exe.blockmap" `
            "dist/latest.yml" `
            "dist/Mineradio-$version-SHA256SUMS.txt" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload 失败，退出码：$LASTEXITCODE"
          }
          
          Write-Host "✅ All assets uploaded successfully!"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
