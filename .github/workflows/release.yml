name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from package.json
        id: package_version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh
      
      - name: Get release upload URL
        id: get_release
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
            $release = gh api repos/${{ github.repository }}/releases/tags/$tag | ConvertFrom-Json
            echo "UPLOAD_URL=$($release.upload_url)" >> $env:GITHUB_OUTPUT
          } else {
            echo "UPLOAD_URL=${{ github.event.release.upload_url }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Setup.exe
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.UPLOAD_URL }}
          asset_path: ./dist/Mineradio-${{ steps.package_version.outputs.VERSION }}-Setup.exe
          asset_name: Mineradio-${{ steps.package_version.outputs.VERSION }}-Setup.exe
          asset_content_type: application/octet-stream
      
      - name: Upload Setup.exe.blockmap
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.UPLOAD_URL }}
          asset_path: ./dist/Mineradio-${{ steps.package_version.outputs.VERSION }}-Setup.exe.blockmap
          asset_name: Mineradio-${{ steps.package_version.outputs.VERSION }}-Setup.exe.blockmap
          asset_content_type: application/octet-stream
      
      - name: Upload latest.yml
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.UPLOAD_URL }}
          asset_path: ./dist/latest.yml
          asset_name: latest.yml
          asset_content_type: text/yaml
      
      - name: Generate SHA256 checksums
        run: |
          cd dist
          $version = "${{ steps.package_version.outputs.VERSION }}"
          $setupFile = "Mineradio-$version-Setup.exe"
          $hash = (Get-FileHash $setupFile -Algorithm SHA256).Hash.ToLower()
          "$hash  $setupFile" | Out-File -FilePath "Mineradio-$version-SHA256SUMS.txt" -Encoding utf8
        shell: pwsh
      
      - name: Upload SHA256SUMS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.UPLOAD_URL }}
          asset_path: ./dist/Mineradio-${{ steps.package_version.outputs.VERSION }}-SHA256SUMS.txt
          asset_name: Mineradio-${{ steps.package_version.outputs.VERSION }}-SHA256SUMS.txt
          asset_content_type: text/plain
