name: ✨ Feature Request
description: 建议新功能
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能。
        
  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 这个功能解决什么问题？
      placeholder: 我希望能够...
    validations:
      required: true
      
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望如何实现这个功能？
      placeholder: 添加一个按钮...
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他可行的方案？
      
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息或截图
